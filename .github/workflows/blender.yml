name: blender-assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/blender/**', '.github/workflows/blender.yml', 'mod/RageEngine/Textures/Spawner/**', 'mod/RageEngine/Textures/Items54/**', 'mod/RageEngine/Textures/Items55/**']
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Blender
        run: |
          set -e
          V=4.2.3
          F=blender-$V-linux-x64.tar.xz; UA="Mozilla/5.0 (X11; Linux x86_64)"
          ok=0
          for u in https://download.blender.org/release/Blender4.2/$F https://mirror.clarkson.edu/blender/release/Blender4.2/$F https://ftp.halifax.rwth-aachen.de/blender/release/Blender4.2/$F https://mirrors.ocf.berkeley.edu/blender/release/Blender4.2/$F; do
            if curl -fsSL --retry 2 -A "$UA" -o /tmp/b.tar.xz "$u"; then echo "got $u"; ok=1; break; else echo "failed $u"; fi
          done
          if [ $ok = 1 ]; then mkdir -p /tmp/blender && tar -xf /tmp/b.tar.xz -C /tmp/blender --strip-components=1
          else echo "mirrors failed - apt blender"; sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq blender >/dev/null; mkdir -p /tmp/blender; ln -sf "$(command -v blender)" /tmp/blender/blender; fi
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 >/dev/null 2>&1 || true
          /tmp/blender/blender --version | head -1
      - name: Build assets
        run: |
          export RE55_ONLY="$(cat tools/blender/re55_only.txt 2>/dev/null | tr -d ' \n')"; echo "RE55_ONLY=$RE55_ONLY"
          mkdir -p out
          [ -n "$RE55_ONLY" ] || /tmp/blender/blender -b --factory-startup -P tools/blender/re_assets.py -- $PWD/out 2>&1 | tee out/blender.log | grep -E "wrote|DONE|Error|Traceback|line [0-9]+" || true
          [ -n "$RE55_ONLY" ] || /tmp/blender/blender -b --factory-startup -P tools/blender/re_spawner.py -- $PWD/out $PWD/mod/RageEngine/Textures/Spawner 2>&1 | tee out/spawner.log | grep -E "wrote|DONE|Error|Traceback|line [0-9]+" || true
          /tmp/blender/blender -b --factory-startup -P tools/blender/re_items55.py -- $PWD/out $PWD/mod/RageEngine/Textures/Items55 $PWD/mod/RageEngine/Textures/Items54 2>&1 | tee out/items55.log | grep -E "wrote|DONE|tris|Error|Traceback|line [0-9]+|unity m" || true
          if [ -z "$RE55_ONLY" ]; then
          /tmp/blender/blender -b --factory-startup -P tools/blender/re_items54.py -- $PWD/out $PWD/mod/RageEngine/Textures/Items54 2>&1 | tee out/items54.log | grep -E "wrote|DONE|tris|Error|Traceback|line [0-9]+" || true
          fi
          ls -la out
      - name: Publish to branch blender-out
        run: |
          git config user.name "rage-ci"; git config user.email "rage-ci@users.noreply.github.com"
          git checkout --orphan blender-out
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name out ! -name .git -exec rm -rf {} +
          mv out/* . && rmdir out
          git add -A && git commit -qm "assets $(date -u)" && git push -f origin blender-out
