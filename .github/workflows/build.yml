name: Build Rage Engine
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile
        id: compile
        run: |
          set -o pipefail
          dotnet build build/RageEngine.csproj -c Release -o out -clp:NoSummary 2>&1 | tee build.log
      - name: Package the mod
        if: success()
        run: |
          VER=$(grep -oP 'Version = "\K[0-9.]+' src/RageEngine/RageEngineScript.cs)
          echo "VER=$VER" >> $GITHUB_ENV
          mkdir -p dist/RageEngine
          cp -r mod/RageEngine/. dist/RageEngine/
          cp out/RageEngine.dll dist/RageEngine/
          sed -i "s/\"ModVersion\": \"[^\"]*\"/\"ModVersion\": \"$VER\"/" dist/RageEngine/manifest.json
          cd dist && zip -qr ../RageEngine-$VER.zip RageEngine && cd ..
          ls -la RageEngine-$VER.zip
      - name: Music and ambience (real recordings, fetched at build time)
        if: success()
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          M=dist/RageEngine/Music; A=dist/RageEngine/Ambience; mkdir -p $M $A /tmp/au
          get() { curl -fsSL --retry 2 -o "$2" "$1" || curl -fsSL --retry 2 -o "$2" "$3"; }
          IC=https://incompetech.com/music/royalty-free/mp3-royaltyfree; AX=http://aux.incompetech.com/music/royalty-free/mp3-royaltyfree
          i=0
          for t in "Bossa Antigua" "Lobby Time" "Smooth Lovin" "Jazz Brunch" "Local Forecast - Slower"; do
            u=$(echo "$t" | sed 's/ /%20/g'); i=$((i+1))
            if get "$IC/$u.mp3" /tmp/au/l$i.mp3 "$AX/$u.mp3"; then
              ffmpeg -loglevel error -y -i /tmp/au/l$i.mp3 -ac 1 -ar 32000 -af loudnorm=I=-20:TP=-2 -c:a libvorbis -q:a 2 "$M/lounge_$i.ogg" && echo "$t Kevin MacLeod (incompetech.com) - Licensed under Creative Commons: By Attribution 4.0 License http://creativecommons.org/licenses/by/4.0/" >> /tmp/au/credits.txt
            else echo "MISSING music: $t" | tee -a build.log; fi
          done
          if get "$IC/Local%20Forecast%20-%20Elevator.mp3" /tmp/au/el.mp3 "$AX/Local%20Forecast%20-%20Elevator.mp3"; then
            ffmpeg -loglevel error -y -i /tmp/au/el.mp3 -ac 1 -ar 32000 -af "loudnorm=I=-20:TP=-2,lowpass=f=4500,highpass=f=180" -c:a libvorbis -q:a 2 "$M/elevator.ogg" && echo "Local Forecast - Elevator Kevin MacLeod (incompetech.com) - Licensed under Creative Commons: By Attribution 4.0 License http://creativecommons.org/licenses/by/4.0/" >> /tmp/au/credits.txt
          else echo "MISSING music: elevator" | tee -a build.log; fi
          if get https://opengameart.org/sites/default/files/wind-01.ogg /tmp/au/wind.ogg https://opengameart.org/sites/default/files/wind-01_0.ogg; then
            ffmpeg -loglevel error -y -i /tmp/au/wind.ogg -ac 1 -ar 32000 -c:a libvorbis -q:a 3 "$A/wind.ogg" && echo "Wind loop: created by Jonathan Shaw (InspectorJ) https://freesound.org/people/InspectorJ/sounds/376415/ , loop by AntumDeluge https://opengameart.org/node/101110 - CC-BY 3.0" >> /tmp/au/credits.txt
          else echo "MISSING ambience: wind" | tee -a build.log; fi
          { echo; echo "# Map music and ambience (downloaded at build time)"; sed 's/^/- /' /tmp/au/credits.txt; } >> dist/RageEngine/SOUND_CREDITS.md
          ls -la $M $A | tee -a build.log
          cd dist && rm -f ../RageEngine-$VER.zip && zip -qr ../RageEngine-$VER.zip RageEngine && cd .. && ls -la RageEngine-$VER.zip | tee -a build.log
      - name: Publish release (download this on the Quest)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RageEngine-$VER.zip --title "Rage Engine $VER" --notes "Download RageEngine-$VER.zip, then install it with Mobile VR Station (Mods > Blade & Sorcery Nomad) or copy the RageEngine folder into Android/data/com.Warpfrog.BladeAndSorcery/files/Mods." --latest
      - name: Keep the build log on the ci-log branch
        if: always()
        run: |
          git config user.name "rage-engine-ci"; git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || echo "no log" > /tmp/log/build.log
          echo "${{ job.status }} $(date -u) $GITHUB_SHA" > /tmp/log/status.txt
          [ -f out/RageEngine.dll ] && cp out/RageEngine.dll /tmp/log/ || true
          git checkout --orphan ci-log && git rm -rqf . && cp /tmp/log/* . && git add -A && git commit -qm "build log $GITHUB_SHA" && git push -f origin ci-log
