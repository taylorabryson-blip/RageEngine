name: Build Rage Engine
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile
        id: compile
        run: |
          set -o pipefail
          dotnet build build/RageEngine.csproj -c Release -o out -clp:NoSummary 2>&1 | tee build.log
      - name: Package the mod
        if: success()
        run: |
          VER=$(grep -oP 'Version = "\K[0-9.]+' src/RageEngine/RageEngineScript.cs)
          echo "VER=$VER" >> $GITHUB_ENV
          mkdir -p dist/RageEngine
          cp -r mod/RageEngine/. dist/RageEngine/
          cp out/RageEngine.dll dist/RageEngine/
          sed -i "s/\"ModVersion\": \"[^\"]*\"/\"ModVersion\": \"$VER\"/" dist/RageEngine/manifest.json
          cd dist && zip -qr ../RageEngine-$VER.zip RageEngine && cd ..
          ls -la RageEngine-$VER.zip
      - name: Music and ambience (real recordings, fetched at build time)
        if: success()
        run: |
          if ! command -v ffmpeg >/dev/null; then
            timeout 240 sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1 || {
              echo "apt ffmpeg slow - static build"; curl -fsSL --max-time 180 -o /tmp/ff.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz &&
              mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1 && sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/; }
          fi
          ffmpeg -version | head -1
          M=dist/RageEngine/Music; A=dist/RageEngine/Ambience; mkdir -p $M $A /tmp/au
          get() { curl -fsSL --max-time 90 --retry 2 -o "$2" "$1" || curl -fsSL --max-time 90 --retry 2 -o "$2" "$3"; }
          IC=https://incompetech.com/music/royalty-free/mp3-royaltyfree; AX=http://aux.incompetech.com/music/royalty-free/mp3-royaltyfree
          i=0
          for t in "Bossa Antigua" "Lobby Time" "Smooth Lovin" "Jazz Brunch" "Local Forecast - Slower"; do
            u=$(echo "$t" | sed 's/ /%20/g'); i=$((i+1))
            if get "$IC/$u.mp3" /tmp/au/l$i.mp3 "$AX/$u.mp3"; then
              ffmpeg -nostdin -loglevel error -y -i /tmp/au/l$i.mp3 -ac 1 -ar 32000 -af loudnorm=I=-20:TP=-2 -c:a libvorbis -q:a 2 "$M/lounge_$i.ogg" && echo "$t Kevin MacLeod (incompetech.com) - Licensed under Creative Commons: By Attribution 4.0 License http://creativecommons.org/licenses/by/4.0/" >> /tmp/au/credits.txt
            else echo "MISSING music: $t" | tee -a build.log; fi
          done
          if get "$IC/Local%20Forecast%20-%20Elevator.mp3" /tmp/au/el.mp3 "$AX/Local%20Forecast%20-%20Elevator.mp3"; then
            ffmpeg -nostdin -loglevel error -y -i /tmp/au/el.mp3 -ac 1 -ar 32000 -af "loudnorm=I=-20:TP=-2,lowpass=f=4500,highpass=f=180" -c:a libvorbis -q:a 2 "$M/elevator.ogg" && echo "Local Forecast - Elevator Kevin MacLeod (incompetech.com) - Licensed under Creative Commons: By Attribution 4.0 License http://creativecommons.org/licenses/by/4.0/" >> /tmp/au/credits.txt
          else echo "MISSING music: elevator" | tee -a build.log; fi
          if get https://opengameart.org/sites/default/files/wind-01.ogg /tmp/au/wind.ogg https://opengameart.org/sites/default/files/wind-01_0.ogg; then
            ffmpeg -nostdin -loglevel error -y -i /tmp/au/wind.ogg -ac 1 -ar 32000 -c:a libvorbis -q:a 3 "$A/wind.ogg" && echo "Wind loop: created by Jonathan Shaw (InspectorJ) https://freesound.org/people/InspectorJ/sounds/376415/ , loop by AntumDeluge https://opengameart.org/node/101110 - CC-BY 3.0" >> /tmp/au/credits.txt
          else echo "MISSING ambience: wind" | tee -a build.log; fi
          # vomiting: real CC0 recordings from freesound (preview found on the sound's page)
          S=dist/RageEngine/Sounds
          fs() { # $1 page  $2 out.mp3
            u=$(curl -fsSL --max-time 40 -A "Mozilla/5.0" "$1" | grep -o 'https://cdn.freesound.org/previews/[^"]*-hq.mp3' | head -1)
            [ -n "$u" ] && curl -fsSL --max-time 60 -A "Mozilla/5.0" -o "$2" "$u"; }
          # squeeze out the silences first, so every cut lands on the actual sound
          vcut() { [ -f "$1.dense.wav" ] || ffmpeg -nostdin -loglevel error -y -i "$1" -ac 1 -ar 22050 -af "silenceremove=start_periods=1:start_threshold=-40dB:stop_periods=-1:stop_threshold=-40dB:stop_duration=0.25" "$1.dense.wav"
                   ffmpeg -nostdin -loglevel error -y -i "$1.dense.wav" -ss "$2" -t "$3" -af "loudnorm=I=-18:TP=-2,afade=t=out:st=$(echo "$3 - 0.25" | bc):d=0.25" -ar 22050 -c:a pcm_s16le "$4"
                   echo "$4 $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$1.dense.wav") $(ffmpeg -nostdin -i "$4" -af volumedetect -f null - 2>&1 | grep mean_volume)" | tee -a build.log; }
          if fs https://freesound.org/people/arnaump/sounds/232540/ /tmp/au/v1.mp3; then
            vcut /tmp/au/v1.mp3 0 2.6 $S/NRE_Vomit_1.wav; vcut /tmp/au/v1.mp3 2.4 2.6 $S/NRE_Vomit_2.wav
            echo "NRE_Vomit_1-2: vomit.wav by arnaump https://freesound.org/s/232540/ - CC0" >> /tmp/au/credits.txt
          else echo "MISSING sound: vomit" | tee -a build.log; fi
          if fs https://freesound.org/people/mefrancis13/sounds/117605/ /tmp/au/v2.mp3; then
            vcut /tmp/au/v2.mp3 0 2.18 $S/NRE_Retch_1.wav
            echo "NRE_Retch_1: Retching by mefrancis13 https://freesound.org/s/117605/ - CC0" >> /tmp/au/credits.txt
          else echo "MISSING sound: retch" | tee -a build.log; fi
          if fs https://freesound.org/people/SpliceSound/sounds/338116/ /tmp/au/v3.mp3; then
            vcut /tmp/au/v3.mp3 0 1.6 $S/NRE_VomitSplat_1.wav
            echo "NRE_VomitSplat_1: Vomit, puking spilling water onto grass splat by SpliceSound https://freesound.org/s/338116/ - CC0" >> /tmp/au/credits.txt
          else echo "MISSING sound: vomit splat" | tee -a build.log; fi
          # 0.42 maps: the subway train and the saloon doors (real recordings, CC BY 4.0 - credited)
          if fs https://freesound.org/people/InspectorJ/sounds/346370/ /tmp/au/t1.mp3; then
            vcut /tmp/au/t1.mp3 5.5 6 $S/NRE_Train_1.wav
            echo "NRE_Train_1: \"Train Passing, Close\" by InspectorJ (www.jshaw.co.uk) of Freesound.org https://freesound.org/s/346370/ - CC BY 4.0" >> /tmp/au/credits.txt
          else echo "MISSING sound: train" | tee -a build.log; fi
          if fs https://freesound.org/people/InspectorJ/sounds/342241/ /tmp/au/d1.mp3; then
            vcut /tmp/au/d1.mp3 0 1.5 $S/NRE_DoorCreak_1.wav
            echo "NRE_DoorCreak_1: \"Door Squeak, Normal, A.wav\" by InspectorJ (www.jshaw.co.uk) of Freesound.org https://freesound.org/s/342241/ - CC BY 4.0" >> /tmp/au/credits.txt
          else echo "MISSING sound: door creak" | tee -a build.log; fi
          ls -la $S | grep -i "vomit\|retch" | tee -a build.log
          { echo; echo "# Map music, ambience and vomiting sounds (downloaded at build time)"; sed 's/^/- /' /tmp/au/credits.txt; } >> dist/RageEngine/SOUND_CREDITS.md
          ls -la $M $A | tee -a build.log
          cd dist && rm -f ../RageEngine-$VER.zip && zip -qr ../RageEngine-$VER.zip RageEngine && cd .. && ls -la RageEngine-$VER.zip | tee -a build.log
      - name: Publish release (download this on the Quest)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RageEngine-$VER.zip --title "Rage Engine $VER" --notes "Download RageEngine-$VER.zip, then install it with Mobile VR Station (Mods > Blade & Sorcery Nomad) or copy the RageEngine folder into Android/data/com.Warpfrog.BladeAndSorcery/files/Mods." --latest
      - name: Keep the build log on the ci-log branch
        if: always()
        run: |
          git config user.name "rage-engine-ci"; git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/log && cp build.log /tmp/log/ 2>/dev/null || echo "no log" > /tmp/log/build.log
          echo "${{ job.status }} $(date -u) $GITHUB_SHA" > /tmp/log/status.txt
          [ -f out/RageEngine.dll ] && cp out/RageEngine.dll /tmp/log/ || true
          git checkout --orphan ci-log && git rm -rqf . && cp /tmp/log/* . && git add -A && git commit -qm "build log $GITHUB_SHA" && git push -f origin ci-log
