name: symbolize-quest-crash
on:
  workflow_dispatch:
  push:
    paths: ['tools/symbolize/**']
permissions:
  contents: write
jobs:
  sym:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unity 2021.3.38f1 Android symbols
        run: |
          mkdir -p /tmp/u && cd /tmp/u
          H=7a2fa5d8d101; V=2021.3.38f1
          for URL in \
            https://download.unity3d.com/download_unity/$H/LinuxEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-$V.tar.xz \
            https://netstorage.unity3d.com/unity/$H/LinuxEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-$V.tar.xz \
            https://beta.unity3d.com/download/$H/LinuxEditorTargetInstaller/UnitySetup-Android-Support-for-Editor-$V.tar.xz ; do
            echo "trying $URL"
            curl -sSL -A "Mozilla/5.0" -o a.tar.xz "$URL" || true
            ls -la a.tar.xz; head -c 200 a.tar.xz | strings | head -3
            if [ $(stat -c%s a.tar.xz) -gt 1000000 ]; then echo OK; break; fi
          done
          if [ $(stat -c%s a.tar.xz) -gt 1000000 ]; then
            tar -xJf a.tar.xz --wildcards '*il2cpp/Release/Symbols/arm64-v8a/libunity*' || true
          else
            for URL in https://download.unity3d.com/download_unity/$H/TargetSupportInstaller/UnitySetup-Android-Support-for-Editor-$V.exe https://netstorage.unity3d.com/unity/$H/TargetSupportInstaller/UnitySetup-Android-Support-for-Editor-$V.exe; do
              echo "trying $URL"; curl -sSL -A "Mozilla/5.0" -o a.exe "$URL" || true; ls -la a.exe
              if [ $(stat -c%s a.exe) -gt 1000000 ]; then break; fi
            done
            sudo apt-get install -y -qq p7zip-full >/dev/null 2>&1 || true
            7z x -y a.exe -o/tmp/u/x '*il2cpp*Release*Symbols*arm64-v8a*libunity*' -r >/dev/null || 7z x -y a.exe -o/tmp/u/x >/dev/null || true
          fi
          find /tmp/u -name 'libunity*sym*' -exec ls -la {} \;
      - name: symbolize
        run: |
          S=$(find /tmp/u -name 'libunity*sym*' | head -1)
          mkdir -p out
          echo "symbols: $S" > out/sym.txt
          readelf -n "$S" | grep -i "build id" >> out/sym.txt || true
          which llvm-symbolizer llvm-addr2line addr2line >> out/sym.txt 2>&1 || true
          SYMB=$(ls /usr/bin/llvm-symbolizer* 2>/dev/null | head -1)
          for f in tools/symbolize/*_unity.txt; do
            echo "== $f" >> out/sym.txt
            while read a; do
              echo "-- $a" >> out/sym.txt
              $SYMB --obj="$S" --functions=linkage --demangle --inlines "$a" >> out/sym.txt 2>&1 || true
            done < "$f"
          done
          cat out/sym.txt
      - name: publish
        run: |
          cd out && git init -q && git checkout -q -b symbolize-out && git add -A && git -c user.name=ci -c user.email=ci@x commit -qm "symbolized" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" symbolize-out
